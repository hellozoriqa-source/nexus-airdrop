<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | ETH Airdrop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            --bg: #0b0b0f;
            --card-bg: #161b22;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 10% 20%, rgba(249, 115, 22, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 2rem; margin: 0 0 10px 0; font-weight: 800; }
        .subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; line-height: 1.5; }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background: #ea580c; }
        
        #status { margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .connected-info { margin-top: 15px; color: #00ff96; font-size: 0.9rem; }
        
        .claim-section {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nexus ETH Airdrop</h1>
        <p class="subtitle">Connect your Ethereum wallet to claim 100 NEX tokens.</p>
        
        <button id="connectBtn" class="btn-primary">Connect Ethereum Wallet</button>
        <div id="status"></div>
        <div id="connectedInfo" class="connected-info"></div>

        <div id="claimSection" class="claim-section">
            <p>You are eligible for <strong>100 NEX</strong> tokens on Ethereum.</p>
            <button id="claimBtn" class="btn-primary" style="background-color: #00ff96; color: #000;">Claim Airdrop</button>
        </div>
    </div>

    <!-- Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- Web3 Onboard -->
    <script type="module">
        import { init, disconnect } from "https://cdn.skypack.dev/@web3-onboard/core";
        import injectedModule from "https://cdn.skypack.dev/@web3-onboard/injected-wallets";

        // Initialize Web3 Onboard for EVM (Ethereum) only
        const wallets = injectedModule();
        const initWeb3 = init({
            wallets: [wallets],
            chains: [
                { id: '0x1', token: 'ETH', label: 'Ethereum Mainnet', rpcUrl: 'https://eth.llamarpc.com' }
            ],
            appInfo: { appName: 'Nexus ETH Airdrop' },
        });

        // Your Contract Address
        const CONTRACT_ADDRESS = "PASTE_YOUR_DEPLOYED_CONTRACT_ADDRESS_HERE";
        const CONTRACT_ABI = [
            "function claim() external",
            "function hasClaimed(address) view returns (bool)",
            "function name() view returns (string)"
        ];

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const connectedInfo = document.getElementById('connectedInfo');
        const claimSection = document.getElementById('claimSection');
        const claimBtn = document.getElementById('claimBtn');

        let contract;

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = "Connecting to Ethereum...";
                const walletList = await initWeb3.connectWallet();
                
                if (walletList && walletList.length > 0) {
                    const wallet = walletList[0];
                    const address = wallet.accounts[0].address;
                    
                    connectBtn.style.display = 'none';
                    connectedInfo.textContent = `Connected: ${address.slice(0, 6)}...${address.slice(-4)}`;
                    statusDiv.textContent = "Ethereum Wallet connected.";
                    
                    // Initialize Contract
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    // Check if already claimed
                    const hasClaimed = await contract.hasClaimed(address);
                    if (hasClaimed) {
                        statusDiv.textContent = "You have already claimed your airdrop!";
                        claimSection.style.display = 'none';
                    } else {
                        claimSection.style.display = 'block';
                    }
                }
            } catch (error) {
                statusDiv.textContent = "Connection cancelled.";
                console.error(error);
            }
        });

        claimBtn.addEventListener('click', async () => {
            statusDiv.textContent = "Claiming tokens...";
            try {
                const tx = await contract.claim();
                statusDiv.textContent = "Transaction submitted! Waiting for confirmation...";
                await tx.wait();
                statusDiv.textContent = "Success! 100 NEX claimed.";
                claimSection.style.display = 'none';
                connectBtn.textContent = "Claimed";
                connectBtn.style.display = 'block';
                connectBtn.disabled = true;
            } catch (error) {
                statusDiv.textContent = "Claim failed. Try again.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
